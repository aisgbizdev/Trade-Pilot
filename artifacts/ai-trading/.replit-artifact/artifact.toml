kind = "web"
previewPath = "/"
title = "AI Trading Assistant"
version = "1.0.0"
id = "artifacts/ai-trading"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20853

[services.development]
run = "pnpm --filter @workspace/ai-trading run dev"

[services.env]
PORT = "20853"
BASE_PATH = "/"

# Production runs Vite's preview server instead of the workspace static
# file server. The static server returns a raw 404 for direct visits to
# client-side routes such as /privacy, /login, and /terms, while Vite
# preview provides the SPA history fallback those routes require.
# The api-server remains a separate service for /api.
[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/ai-trading", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"
PORT = "20853"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/ai-trading", "run", "serve"]

[services.production.run.env]
NODE_ENV = "production"
BASE_PATH = "/"
PORT = "20853"
